services:
  datasette:
    restart: always
    build: .
    env_file:
      - .env
    volumes:
      - ./data:/mnt/data
    ports:
      - "8001:8001"
    entrypoint: /bin/sh
    command: >
      -c "
      datasette serve -i /mnt/data/*.db 
      --inspect-file=/mnt/data/counts.json 
      --metadata /mnt/data/metadata.yml
      --host 0.0.0.0 
      --port 8001 
      --setting max_returned_rows 10000 
      --setting sql_time_limit_ms 50000 
      --setting facet_time_limit_ms 50000 
      --setting max_csv_mb 0 
      --setting force_https_urls 1 
      --load-extension=spatialite"

  datasette-inspect:
    build: .
    volumes:
      - ./data:/mnt/data
    entrypoint: /bin/sh
    command: >
      -c "
      datasette inspect /mnt/data/*.db
      --inspect-file=/mnt/data/counts.json"
