services:
  datasette:
    container_name: datasette
    build: .
    restart: always
    env_file:
      - .env
    volumes:
      - ./data:/mnt/data
    expose:
      - "8001"
    networks:
      - webnet
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8001/-/versions"]
      interval: 60s
      timeout: 2s
      retries: 3
      start_period: 20s
    entrypoint: /bin/sh
    command: >
      -c "
      datasette serve -i /mnt/data/*.db
      --inspect-file=/mnt/data/counts.json
      --metadata /mnt/data/metadata.yml
      --host 0.0.0.0
      --port 8001
      --setting max_returned_rows 2000
      --setting force_https_urls 1
      --load-extension=spatialite"

  datasette-inspect:
    build: .
    volumes:
      - ./data:/mnt/data
    networks:
      - webnet
    entrypoint: /bin/sh
    command: >
      -c "
      datasette inspect /mnt/data/*.db
      --inspect-file=/mnt/data/counts.json"

networks:
  webnet:
    external: true
