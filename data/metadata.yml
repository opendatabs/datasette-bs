databases:
  Smiley-Geschwindigkeitsmessungen:
    title: "Einzelmessungen der Smiley-Geschwindigkeitsanzeigen"
    description_html: >
      <p>Einzelmessungen der Smiley-Geschwindigkeitsanzeigen der Kantonspolizei Basel-Stadt ab 2023 (Zeitpunkt des Beginns der Messung). 
      Die Smiley-Geschwindigkeitsanzeigen sind nicht geeicht und entsprechend können die Werte von der tatsächlich gefahrenen Geschwindigkeit abweichen. 
      Hinweis: Die Messungen sind nicht repräsentativ für das ganze Jahr und müssen im Kontext des Erhebungsdatums betrachtet werden. 
      Darüber hinaus wurden gewisse Messungen während einer ausserordentlichen Verkehrsführung 
      (z.B. Umleitungsverkehr infolge von Baustellentätigkeiten etc.) erhoben. Manipulationen an Geräten können zu fehlerhaften Messungen führen.</p>
      <p>Die Geschwindigkeitsmessungen durchlaufen vier Phasen: <b>Vormessung</b>, <b>Betrieb</b>, <b>Nachmessung</b> und <b>nach Ende</b>. 
      In der Vormessungsphase wird die Geschwindigkeit der Fahrzeuge an den Smiley-Geschwindigkeitsanzeigen gemessen, wobei die Anzeigen nicht aktiviert sind. 
      In der Betriebsphase sind die Smiley-Geschwindigkeitsanzeigen hingegen eingeschaltet. 
      Nachfolgend werden die Anzeigen ausgeschaltet und die Geschwindigkeit der Fahrzeuge an den Smiley-Geschwindigkeitsanzeigen wird erneut gemessen. 
      Die letzte Phase 'nach Ende' sind Messungen, die ausserhalb des im Projekt definierten Zeitraums vorfallen.</p>
    license: "CC BY 3.0 CH"
    license_url: "https://creativecommons.org/licenses/by-nc/3.0/ch/"
    tables:
      Einzelmessungen:
        sort_desc: "Messung_Timestamp"
        columns:
          Messung_Timestamp: "Zeitpunkt der Messung"
          id_standort: "Eindeutige Standortkennung"
          Zyklus: "Messzyklus"
          Phase: "Phase der Messung (Vormessung, Betrieb, Nachmessung oder nach Ende)"
          Messung_Datum: "Datum der Messung"
          Messung_Zeit: "Uhrzeit der Messung"
          V_Einfahrt: "Einfahrtsgeschwindigkeit in km/h"
          V_Ausfahrt: "Ausfahrtsgeschwindigkeit in km/h"
          V_Delta: "Differenz zwischen Einfahrts- und Ausfahrtsgeschwindigkeit in km/h"
        facets:
          - "id_standort"
          - "Zyklus"
          - "Phase"
      Einsatzplan:
        sort_desc: "Start_Vormessung"
        columns:
          id_standort: "Eindeutige Standortkennung"
          Zyklus: "Messzyklus"
          Phase: "Phase der Messung (Vormessung, Betrieb, Nachmessung oder nach Ende)"
          Strassenname: "Name der Strasse"
          Geschwindigkeit: "Maximale erlaubte Geschwindigkeit"
          Ort_Abkuerzung: "Abkürzung des Ortes"
          Ort: "Ortsname"
          Start_Vormessung: "Beginn der Vormessung (mit ausgeschalteter Anzeige)"
          Start_Betrieb: "Beginn des aktiven Betriebs"
          Start_Nachmessung: "Beginn der Nachmessung (mit ausgeschalteter Anzeige)"
          Ende: "Ende des Messzyklus am Standort"
          Messung_Jahr: "Jahr der Messung"
          geometry: "Koordinaten des Messstandortes im GeoJSON-Format"
  Geschwindigkeitsmonitoring:
    title: "Geschwindigkeitsmonitoring"
    description_html: >
      <p>Dieser Datensatze zeigt die Messungen des Geschwindigkeitsmonitorings der Kantonspolizei Basel-Stadt.</p>
      <p>Daten handelt es sich ausschliesslich um statistische Erhebungen. 
      Diese stehen nicht in einem Zusammenhang mit Ordnungsbussen oder einer strafrechtlichen Verfolgung. 
      Die statistischen Geschwindigkeitsmessungen dienen der Kantonspolizei Basel-Stadt zur Überprüfung der Geschwindigkeit 
      sowie der Verkehrssicherheit (z.B. Sicherheit an Fussgängerstreifen) an der betreffenden Örtlichkeit. 
      Die Ergebnisse dienen zur Entscheidung, an welchen Örtlichkeiten Handlungsbedarf in Form von Geschwindigkeitskontrollen besteht. 
      Jedes Statistikgerät besitzt eine einzige Punktgeometrie und ist meist mit zwei Richtungen versehen (Richtung 1 und 2).</p>
      <p>Messungen sind nicht zwingend repräsentativ für das ganze Jahr und müssen im Kontext des Erhebungsdatums betrachtet werden. 
      Darüber hinaus wurden gewisse Messungen während einer ausserordentlichen Verkehrsführung (z.B. Umleitungsverkehr infolge von Baustellentätigkeiten etc.) erhoben. 
      Manipulationen an Geräten können zu fehlerhaften Messungen führen.</p>
    license: "CC BY 3.0 CH"
    license_url: "https://creativecommons.org/licenses/by-nc/3.0/ch/"
    source: "Kantonspolizei"
    source_url: "https://www.polizei.bs.ch/"
    about: "Vortrag zu Geschwindigkeitsmonitoring"
    about_url: "https://youtu.be/9H3mTXdc-A8?feature=shared&t=1564"
    queries:
      date_search:
        sql: |-
          select * 
          from Einzelmessungen 
          where Timestamp like '%' || :text || '%'
          order by Timestamp desc
        title: "Suche nach Datum"
    tables:
      Einzelmessungen:
        sort_desc: "Timestamp"
        columns:
          Timestamp: "Datum und Uhrzeit"
          Messung-ID: "Laufnummer der Messung; eine Messung beinhaltet alle Fahrten eines Messgeräts an einem Standort"
          Richtung ID: "ID der Richtung; In einer Messung werden i.d.R. Fahrten in zwei Richtungen gemessen."
          Geschwindigkeit: "Geschwindigkeit in km/h"
          Fahrzeuglänge: "Vom Radar gemessene Fahrzeuglänge"
          Zeit: "Uhrzeit (hh:mm:ss) der gemessenen Fahrt"
          Datum: "Datum"
          Datum_Zeit: "Datum und Uhrzeit als Text"
        units:
          Geschwindigkeit: "Kilometer_pro_Stunde"
          Fahrzeuglänge: "Meter"
        facets:
          - date: "Timestamp"
          - "Messung-ID"
          - "Richtung ID"
      Kennzahlen_pro_Richtung:
        sort_desc: "Messung-ID"
        columns:
          Messung-ID: "Laufnummer der Messung; eine Messung beinhaltet alle Fahrten eines Messgeräts an einem Standort"
          Richtung ID: "ID der Richtung; In einer Messung werden i.d.R. Fahrten in zwei Richtungen gemessen."
          Richtung: "Name der Fahrtrichtung"
          Fzg: "Anzahl gemessene Fahrzeuge während der Messung"
          V50: "Höchstgeschwindigkeit, welche von 50% der Fahrzeuge nicht überschritten wird"
          V85: "Höchstgeschwindigkeit, welche von 85% der Fahrzeuge nicht überschritten wird"
          Messbeginn: "Datum, an welchem ein Messgerät an einem Standort ausgebracht wurde"
          Messende: "Datum, bis zu welchem ein Messgerät an einem Standort im Einsatz war"
          Zone: "geltende Höchstgeschwindigkeit am Standort der Messung"
          Ort: "Gemeinde am Standort der Messung"
          geometry: "Koordinaten des Messstandortes im GeoJSON-Format"
          Ue_Quote: "Übertretungsquote"
          Strasse: "Name der Strasse, an welcher ein Messgerät ausgebracht wurde"
          Strasse_Nr: "Hausnummer, bei welcher ein Messgerät ausgebracht wurde"
        units:
            Fzg: "Fahrzeuge"
            V50: "Kilometer_pro_Stunde"
            V85: "Kilometer_pro_Stunde"
            Zone: "Kilometer_pro_Stunde"
        facets:
          - "Messung-ID"
          - "Richtung ID"
          - date: "Messbeginn"
          - date: "Messende"
          - "Zone"
          - "Ort"
          - "Strasse"
  Velo_Fuss:
    title: "Verkehrszähldaten Velos und Fussgänger"
    description_html: >
      <p>Resultate der Messungen der Dauerzählstellen und Kurzzeitzählstellen für den Velo- und Fussgängerverkehr.</p>
      <p>Die Fussgängerzähldaten werden monatlich korrigiert und anschliessend veröffentlicht.</p>
      <p>Aus Kostengründen sind nur die Daten des aktuellen und des letzten Jahres als Visualisierung bzw. via API abrufbar.</p>
      <p>Alle Daten seit dem Jahr 2000:</p>
      <ul>
        <li><a href="https://data-bs.ch/mobilitaet/converted_Velo_Fuss_Count.csv">Leicht aufbereiteter Datensatz</a></li>
        <li><a href="https://data-bs.ch/mobilitaet/Velo_Fuss_Count.csv">Rohdaten</a></li>
      </ul>
      <p>FLIR-Zählstellen (Forward Looking Infrared):</p>
      <p><b>Für Velos:</b></p>
      <ul>
        <li><a href="https://data-bs.ch/mobilitaet/converted_FLIR_KtBS_Velo.csv">Leicht aufbereiteter Datensatz</a></li>
        <li><a href="https://data-bs.ch/mobilitaet/FLIR_KtBS_Velo.csv">Rohdaten</a></li>
      </ul>
      <p><b>Für Fussgänger:</b></p>
      <ul>
        <li><a href="https://data-bs.ch/mobilitaet/converted_FLIR_KtBS_FG.csv">Leicht aufbereiteter Datensatz</a></li>
        <li><a href="https://data-bs.ch/mobilitaet/FLIR_KtBS_FG.csv">Rohdaten</a></li>
      </ul>
      <p>Lichtsignalanlagen (LSA):</p>
      <ul>
        <li><a href="https://data-bs.ch/mobilitaet/converted_Velo_LSA_Count.csv">Leicht aufbereiteter Datensatz</a></li>
        <li><a href="https://data-bs.ch/mobilitaet/Velo_LSA_Count.csv">Rohdaten</a></li>
      </ul>
      <p>Jahresweise Downloads ab 2000:</p>
      <ul>
        <li>Velo/Fuss: <code>https://data-bs.ch/mobilitaet/[JAHR]_Velo_Fuss_Count.csv</code></li>
        <li>FLIR Velo: <code>https://data-bs.ch/mobilitaet/[JAHR]_FLIR_KtBS_Velo.csv</code></li>
        <li>FLIR Fussgänger: <code>https://data-bs.ch/mobilitaet/[JAHR]_FLIR_KtBS_FG.csv</code></li>
        <li>LSA: <code>https://data-bs.ch/mobilitaet/[JAHR]_Velo_LSA.csv</code></li>
      </ul>
      <p>Die Zeitangaben (TimeFrom, TimeTo) sind in MEZ (Mitteleuropäische Zeit). Zeitumstellungen werden berücksichtigt: Der Tag der Sommerzeitumstellung hat 23 Stunden, jener der Winterzeitumstellung 25 – bei letzterem werden doppelte Stundenwerte zusammengefasst.</p>
    license: "CC BY 3.0 CH"
    license_url: "https://creativecommons.org/licenses/by-nc/3.0/ch/"
    source: "Amt für Mobilität"
    source_url: "https://www.bs.ch/bvd/mobilitaet/grundlagen-und-strategien/parkplatzkataster-stadt-basel#verkehrszaehlungen"
    about: "Dashboard zu Verkehrszählungen"
    about_url: "https://data-bs.ch/mobilitaet/verkehrszaehl_dashboard/"
    tables:
      Velo_Fuss:
        sort_desc: "DateTimeFrom"
        columns:
          Zst_id: "Zählstellennummer in numerischer Form"
          SiteCode: "Zählstellencode"
          SiteName: "Zählstellenname"
          DateTimeFrom: "Datum und Uhrzeit Messbeginn (in UTC)"
          DateTimeTo: "Datum und Uhrzeit Messende (in UTC)"
          DirectionName: "Richtung/Strassenseite"
          LaneCode: "Spurnummer"¨
          LaneName: "Spurname"
          ValuesApproved: "Daten validiert (1 ja, 0 nein) [Validierte Verkehrszahlen sind kontrollierte und ergänzte Rohdaten. Fehlwerte werden dann ergänzt, wenn sie aufgrund von technischen Problemen entstanden sind.]"
          ValuesEdited: "Ersatzwerte (1 ja, 0 nein) [Fehlwerte werden dann ergänzt, wenn sie aufgrund von technischen Problemen entstanden sind.]"
          TrafficType: "Verkehrsmittel (MIV = motorisierter Individualverkehr)"
