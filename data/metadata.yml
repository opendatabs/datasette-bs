  MIV_Geschwindigkeitsklassen:
    title: "Geschwindigkeitsklassen motorisierter Individualverkehr"
    description_html: >
      <p>Dieser Datensatz enthält die Geschwindigkeitsklassen des motorisierten Individualverkehrs. Die Daten werden vor der Veröffentlichung nicht überprüft oder ergänzt. Daher können jederzeit Datenlücken oder falsche Messungen aufgrund technischer Probleme oder Verkehrsbehinderungen auftreten.</p>
      <p>Aus Kostengründen sind nur die Werte des aktuellen Jahres und der letzten zwei Jahre als Tabelle / Visualisierung sichtbar bzw. via API abgreifbar.</p>
      <p>Die vollständigen Daten ab dem Jahr 2014 können hier heruntergeladen werden:</p>
