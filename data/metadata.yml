plugins:
  datasette-geojson-map:
    tile_layer: https://wmts.geo.bs.ch/wmts/1.0.0/BaseMap_grau/default/3857/{z}/{y}/{x}.png
    tile_layer_options:
      attribution: >-
        Bereitgestellt von <a href="https://map.geo.bs.ch/?lang=de">Geodaten Kanton Basel-Stadt</a>, 
        unter <a href="https://media.bs.ch/original_file/268afcb7a22e30a3632da9978638dabeb97c1eb1/20240822-osm-vektordaten.pdf">CC BY 4.0 + OpenStreetMap</a>.
      minZoom: 10
  datasette-auth-github:
    client_id:
      $env: "GITHUB_CLIENT_ID"
    client_secret:
      $env: "GITHUB_CLIENT_SECRET"
custom_units:
  - "Fahrzeuge = [] = Fzge"
  - "Kilometer_pro_Stunde [] = km/h"
  - "Meter = [] = m"
databases:
  Smiley-Geschwindigkeitsmessungen:
    title: "Einzelmessungen der Smiley-Geschwindigkeitsanzeigen"
    license: "CC BY 3.0 CH"
    license_url: "https://creativecommons.org/licenses/by-nc/3.0/ch/"
    source: "Kantonspolizei Basel-Stadt"
    source_url: "https://www.polizei.bs.ch/"
    about: "Daten auf dem Datenportal"
    about_url: "https://data.bs.ch/explore/dataset/100268/"
    tables:
      Einzelmessungen:
        sort_desc: "Messung_Timestamp"
        columns:
          Messung_Timestamp: "Zeitpunkt der Messung"
          id_standort: "Eindeutige Standortkennung"
          Zyklus: "Messzyklus"
          Phase: "Phase der Messung (Vormessung, Betrieb, Nachmessung oder nach Ende)"
          Messung_Datum: "Datum der Messung"
          Messung_Zeit: "Uhrzeit der Messung"
          V_Einfahrt: "Einfahrtsgeschwindigkeit in km/h"
          V_Ausfahrt: "Ausfahrtsgeschwindigkeit in km/h"
          V_Delta: "Differenz zwischen Einfahrts- und Ausfahrtsgeschwindigkeit in km/h"
        facets:
          - "id_standort"
          - "Zyklus"
          - "Phase"
      Einsatzplan:
        sort_desc: "Start_Vormessung"
        columns:
          id_standort: "Eindeutige Standortkennung"
          Zyklus: "Messzyklus"
          Phase: "Phase der Messung (Vormessung, Betrieb, Nachmessung oder nach Ende)"
          Strassenname: "Name der Strasse"
          Geschwindigkeit: "Maximale erlaubte Geschwindigkeit"
          Ort_Abkuerzung: "Abkürzung des Ortes"
          Ort: "Ortsname"
          Start_Vormessung: "Beginn der Vormessung (mit ausgeschalteter Anzeige)"
          Start_Betrieb: "Beginn des aktiven Betriebs"
          Start_Nachmessung: "Beginn der Nachmessung (mit ausgeschalteter Anzeige)"
          Ende: "Ende des Messzyklus am Standort"
          Messung_Jahr: "Jahr der Messung"
          geometry: "Koordinaten des Messstandortes im GeoJSON-Format"
  Geschwindigkeitsmonitoring:
    title: "Geschwindigkeitsmonitoring"
    license: "CC BY 3.0 CH"
    license_url: "https://creativecommons.org/licenses/by-nc/3.0/ch/"
    source: "Kantonspolizei"
    source_url: "https://www.polizei.bs.ch/"
    about: "Daten auf dem Datenportal"
    about_url: "https://data.bs.ch/explore/dataset/100097/"
    queries:
      date_search:
        sql: |-
          select * 
          from Einzelmessungen 
          where Timestamp like '%' || :text || '%'
          order by Timestamp desc
        title: "Suche nach Datum"
    tables:
      Einzelmessungen:
        sort_desc: "Timestamp"
        columns:
          Timestamp: "Datum und Uhrzeit"
          Messung-ID: "Laufnummer der Messung; eine Messung beinhaltet alle Fahrten eines Messgeräts an einem Standort"
          Richtung ID: "ID der Richtung; In einer Messung werden i.d.R. Fahrten in zwei Richtungen gemessen."
          Geschwindigkeit: "Geschwindigkeit in km/h"
          Fahrzeuglänge: "Vom Radar gemessene Fahrzeuglänge"
          Zeit: "Uhrzeit (hh:mm:ss) der gemessenen Fahrt"
          Datum: "Datum"
          Datum_Zeit: "Datum und Uhrzeit als Text"
        facets:
          - date: "Timestamp"
          - "Messung-ID"
          - "Richtung ID"
      Kennzahlen_pro_Richtung:
        sort_desc: "Messung-ID"
        columns:
          Messung-ID: "Laufnummer der Messung; eine Messung beinhaltet alle Fahrten eines Messgeräts an einem Standort"
          Richtung ID: "ID der Richtung; In einer Messung werden i.d.R. Fahrten in zwei Richtungen gemessen."
          Richtung: "Name der Fahrtrichtung"
          Fzg: "Anzahl gemessene Fahrzeuge während der Messung"
          V50: "Höchstgeschwindigkeit, welche von 50% der Fahrzeuge nicht überschritten wird"
          V85: "Höchstgeschwindigkeit, welche von 85% der Fahrzeuge nicht überschritten wird"
          Messbeginn: "Datum, an welchem ein Messgerät an einem Standort ausgebracht wurde"
          Messende: "Datum, bis zu welchem ein Messgerät an einem Standort im Einsatz war"
          Zone: "geltende Höchstgeschwindigkeit am Standort der Messung"
          Ort: "Gemeinde am Standort der Messung"
          geometry: "Koordinaten des Messstandortes im GeoJSON-Format"
          Ue_Quote: "Übertretungsquote"
          Strasse: "Name der Strasse, an welcher ein Messgerät ausgebracht wurde"
          Strasse_Nr: "Hausnummer, bei welcher ein Messgerät ausgebracht wurde"
        facets:
          - "Messung-ID"
          - "Richtung ID"
          - date: "Messbeginn"
          - date: "Messende"
          - "Zone"
          - "Ort"
          - "Strasse"
