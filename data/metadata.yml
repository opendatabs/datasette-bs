        <li><a href="https://data-bs.ch/mobilitaet/converted_MIV_Class_10_1.csv">Leicht aufbereiteter Datensatz</a></li>
        <li><a href="https://data-bs.ch/mobilitaet/MIV_Class_10_1.csv">Rohdaten</a></li>
      </ul>
