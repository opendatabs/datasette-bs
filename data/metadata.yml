        <li><a href="https://data-bs.ch/mobilitaet/FLIR_KtBS_MIV6.csv">Rohdaten</a></li>
      </ul>
      <p>Lichtsignalanlagen (LSA):</p>
      <ul>
        <li><a href="https://data-bs.ch/mobilitaet/converted_MIV_LSA_Count.csv">Leicht aufbereiteter Datensatz</a></li>
        <li><a href="https://data-bs.ch/mobilitaet/MIV_LSA_Count.csv">Rohdaten</a></li>
      </ul>
      <p>Jahresweise Downloads ab 2014:</p>
