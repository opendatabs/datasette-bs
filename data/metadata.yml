        <li><a href="https://data-bs.ch/mobilitaet/converted_MIV_Speed.csv">Leicht aufbereiteter Datensatz</a></li>
        <li><a href="https://data-bs.ch/mobilitaet/MIV_Speed.csv">Rohdaten</a></li>
      </ul>
      <p>Jahresweise Downloads ab 2014:</p>
      <ul>
        <li>MIV Speed: <code>https://data-bs.ch/mobilitaet/[JAHR]_MIV_Speed.csv</code></li>
      </ul>
